<div class="login-page">
  <mat-card class="login-card">
    <form (ngSubmit)="ingresar()">
      <h1>{{ modoAdmin ? 'Saavia Admin' : 'SAAVIA ERP' }}</h1>
      <p class="subtitle">{{ modoAdmin ? 'Consola administrativa de la plataforma' : 'Ingresa a tu cuenta' }}</p>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" required />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" required />
      </div>

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      <button mat-flat-button color="primary" type="submit" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>

      @if (!modoAdmin) {
        <p class="hint">Usuario demo: admin&#64;demo.cl / admin123</p>
      }

      <button mat-button type="button" class="modo-toggle" (click)="toggleModo()">
        {{ modoAdmin ? 'Ir al acceso de empresa' : 'Acceso administrativo' }}
      </button>
    </form>
  </mat-card>
</div>
