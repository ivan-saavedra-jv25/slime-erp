<h2 mat-dialog-title>Cambiar plan</h2>

<mat-dialog-content>
  <p class="dialog-hint">
    Al cambiar el plan se recalcula automáticamente el precio según el ciclo de facturación vigente.
  </p>

  <div class="form-group">
    <label for="nuevoPlanId">Nuevo plan *</label>
    <select id="nuevoPlanId" [(ngModel)]="nuevoPlanId" name="nuevoPlanId">
      <option [ngValue]="null">Selecciona un plan</option>
      @for (plan of data.planes; track plan.id) {
        <option [ngValue]="plan.id" [disabled]="plan.id === data.planId">
          {{ plan.nombre }} · {{ plan.precioMensual | currency: 'CLP' : 'symbol-narrow' : '1.0-0' }}
        </option>
      }
    </select>
  </div>
  <div class="form-group">
    <label for="motivo">Motivo</label>
    <input
      id="motivo"
      type="text"
      [(ngModel)]="motivo"
      name="motivo"
      placeholder="Ej: La empresa escaló de plan"
    />
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancelar()">Cancelar</button>
  <button mat-flat-button color="primary" [disabled]="!puedeCambiar" (click)="confirmar()">
    <mat-icon>swap_horiz</mat-icon>
    Cambiar plan
  </button>
</mat-dialog-actions>
