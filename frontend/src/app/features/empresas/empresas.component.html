<div class="page-header">
  <h1>Empresas</h1>
  @if (auth.tienePermiso('EMPRESAS_ADMINISTRAR')) {
    <button mat-flat-button color="primary" (click)="abrirCrear()">Nueva empresa</button>
  }
</div>

@if (error) {
  <p class="page-error">{{ error }}</p>
}

<table mat-table [dataSource]="empresas" class="mat-elevation-z1">
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let e">{{ e.nombre }}</td>
  </ng-container>

  <ng-container matColumnDef="rut">
    <th mat-header-cell *matHeaderCellDef>RUT</th>
    <td mat-cell *matCellDef="let e">{{ e.rut }}</td>
  </ng-container>

  <ng-container matColumnDef="plan">
    <th mat-header-cell *matHeaderCellDef>Plan</th>
    <td mat-cell *matCellDef="let e">{{ e.plan }}</td>
  </ng-container>

  <ng-container matColumnDef="activo">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let e">{{ e.activo ? 'Activa' : 'Inactiva' }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let e">
      @if (auth.tienePermiso('EMPRESAS_ADMINISTRAR')) {
        <button mat-icon-button (click)="toggleEstado(e)" [title]="e.activo ? 'Desactivar' : 'Activar'">
          <mat-icon>{{ e.activo ? 'block' : 'check_circle' }}</mat-icon>
        </button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>
