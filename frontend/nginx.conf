server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Consola de plataforma (SUPER_ADMIN): backend administrativo separado.
    location /admin-api/ {
        proxy_pass http://admin-backend:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Landing comercial (NEXO by SAAVIA): sirve la pagina principal y sus
    # propios assets desde una carpeta aparte del build de Angular. Todo lo
    # demas (/login, /dashboard, /ventas, etc.) sigue yendo a la app.
    location = / {
        root /usr/share/nginx/landing;
        try_files /index.html =404;
    }

    location ~ ^/(css|js|data|assets)/ {
        root /usr/share/nginx/landing;
    }

    location = /favicon.svg {
        root /usr/share/nginx/landing;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
